name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      # The direct dependencies are exactly go-sdk and bcommon, go.mod is
      # tidy, nothing is replaced, and go-sdk resolves to exactly v1.7.1 (the
      # DEPS_SDK pin in the Makefile).
      - name: dependency set
        run: make deps-check
      # LICENSE-THIRD-PARTY is generated from what the binaries link; a new
      # dependency without its licence in the file fails here.
      - name: licences
        run: make licences
      # Includes the Go side of the cross-language check: the tests decode,
      # admit and rebuild what the TypeScript codec wrote under testdata/ts.
      - name: test
        run: make go-test
      # Regenerates the Go vectors and compares them byte for byte, so a
      # stale vector or one nothing generates fails here.
      - name: vectors match the Go codec
        run: GOWORK=off go run ./cmd/vectors -check

  # The TypeScript package under host/ runs every Go-generated vector and
  # writes the vectors the Go job reads, so a change that moves the bytes on
  # one side and not the other fails in one job or the other.
  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The runtime major the overlay host runs, which package.json also
          # pins.
          node-version: "24"
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run check
      - name: test
        run: npm test
      - name: vectors match the TypeScript codec
        run: npm run vectors-check
